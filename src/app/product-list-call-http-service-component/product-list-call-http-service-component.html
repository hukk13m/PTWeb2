<table border="1px">
  <thead>
    <tr>
      <th>ID</th>
      <th>NAME</th>
      <th>PRICE</th>
      <th>IMAGE</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>
          {{ p.id }}
        </td>
        <td>
          <a [routerLink]="['/products', p.id]">{{ p.name }}</a>
        </td>
        <td>
          {{ p.price }}
        </td>
        <td>
          <a [routerLink]="['/products', p.id]"
            ><img
              [src]="p.image"
              [alt]="p.name"
              width="100"
              height="100"
              (error)="$any($event.target).src = 'https://placehold.co/100x100?text=No+Image'"
          /></a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">Not Found Products!!!!!!</td>
      </tr>
    }
  </tbody>
</table>

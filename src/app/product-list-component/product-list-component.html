<table border="1px">
  <thead>
    <tr>
      <th>ID</th>
      <th>NAME</th>
      <TH>PRICE</TH>
      <th>IMAGE</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products; track $index) {
      <tr>
        <td>
          {{ p.id }}
        </td>
        <td>
          {{ p.name }}
        </td>
        <td>
          {{ p.price }}
        </td>
        <td>
          <img [src]="p.image" [alt]="p.name" width="100" height="100" />
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">Not Found Products!!!!!!</td>
      </tr>
    }
  </tbody>
</table>
